name: Source workspace regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test nested Git setup and preparation-to-planning adapter path
        run: node --test test/source-workspace.test.js
